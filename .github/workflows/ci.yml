name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze

      # Includes the token contrast test: every text/background pair in the
      # brand palette must pass WCAG AA in both themes.
      - run: flutter test

      # Rule 2 in README.md: this repo is public and must never carry a key.
      - name: No hard-coded API keys
        run: |
          set +e
          grep -rnIE \
            -e "(sk_|pk_|appl_|goog_|AIza)[A-Za-z0-9_-]{8,}" \
            -e "sk-ant-" \
            -e "-----BEGIN [A-Z ]*PRIVATE KEY-----" \
            -e '"type": "service_account"' \
            --exclude-dir=.git --exclude-dir=build --exclude-dir=.dart_tool \
            --exclude=ci.yml .
          rc=$?
          # grep: 0 = secret found (fail), 1 = clean (pass), >=2 = grep error (fail)
          if [ "$rc" -ne 1 ]; then exit 1; fi
